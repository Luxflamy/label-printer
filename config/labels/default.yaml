# 遗留示例模板（40×30mm）— 常用规格请见 templates/50x30_800p_product 等
name: default
description: 通用商品标签（品名 + 条码，水平居中）

label:
  width_mm: 40
  height_mm: 30
  gap_mm: 2
  direction: 1

elements:
  - id: product_name
    type: text
    align: center
    y_mm: 2
    font: "3"
    x_mul: 1
    y_mul: 1
    content: "{{ product_name }}"

  - id: sku
    type: text
    align: center
    y_mm: 8
    font: "2"
    content: "SKU: {{ sku }}"

  - id: barcode
    type: barcode
    align: center
    y_mm: 14
    symbology: "128"
    height_mm: 8
    human_readable: true
    content: "{{ barcode }}"
