# 纯 SKU 小标签排版预设 — 50×30mm，整张只放一行居中放大的 SKU
meta:
  preset: sku_only
  description: "仅 SKU 文本（居中放大），供手工输入的自定义小标签使用"

elements:

  # 用位图文字而非 TSC 内置字号：font_size_mm 只是起始值，
  # render_text_bitmap 会在放不下时自动逐级缩小并居中，
  # 因此短 SKU 用大字、长 SKU 自动收缩，始终填满可用区域。
  - id: sku
    type: bitmap_text
    x_mm: 2
    y_mm: 3
    width_mm: 46
    height_mm: 24
    font_size_mm: 18
    wrap: false
    content: "{{ sku }}"
